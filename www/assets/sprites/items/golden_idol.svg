<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2a6"/>
      <stop offset="45%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Trophy handles -->
  <path d="M18 16 C6 16 6 34 18 34" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M46 16 C58 16 58 34 46 34" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Trophy cup bowl -->
  <path d="M16 12 H48 V22 C48 34 40 40 32 40 C24 40 16 34 16 22 Z" fill="url(#gold)" stroke="#7a5200" stroke-width="2"/>

  <!-- Stem -->
  <path d="M27 40 H37 L34 48 H30 Z" fill="url(#gold)" stroke="#7a5200" stroke-width="1.5"/>

  <!-- Base -->
  <rect x="20" y="48" width="24" height="6" rx="2" fill="url(#gold)" stroke="#7a5200" stroke-width="2"/>
  <rect x="16" y="54" width="32" height="4" rx="1.5" fill="#f6c23e" stroke="#7a5200" stroke-width="2"/>

  <!-- Shine highlight on cup -->
  <path d="M20 14 h12 v6 h-12 z" fill="url(#shine)" opacity="0.4"/>
  <circle cx="22" cy="19" r="2.4" fill="#fff7c8" opacity="0.7"/>
</svg>
